name: Shader portability

on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Shader compilation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            d3d12: 'OFF'
            cpu: 'ON'
            metal: 'OFF'
          - os: windows-latest
            d3d12: 'ON'
            cpu: 'OFF'
            metal: 'OFF'
          - os: macos-26
            d3d12: 'OFF'
            cpu: 'ON'
            metal: 'ON'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Ensure native Metal compiler is available
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcodebuild -version | tee xcode-version.txt
          grep -q '^Xcode 26' xcode-version.txt
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Configure mandatory shader targets
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DPARALLEL_MATER_BUILD_CUDA=OFF
          -DPARALLEL_MATER_BUILD_SLANG_CPU_DRIVER=${{ matrix.cpu }}
          -DPARALLEL_MATER_BUILD_SLANG_METAL_PREVIEW=${{ matrix.metal }}
          -DPARALLEL_MATER_BUILD_D3D12=${{ matrix.d3d12 }}
          -DPARALLEL_MATER_BUILD_GALLERY=OFF
          -DPARALLEL_MATER_BUILD_SLANG_GEOMETRY_CONSTRAINTS=ON
          -DPARALLEL_MATER_BUILD_SLANG_MIRRORS=ON
      # ALL includes the full manifest's CUDA/SPIR-V entries, the portable
      # AVBD core and reflection, Windows DXIL schedules, and every Metal
      # entry (including native compilation on macOS). Runtime Metal tests
      # skip explicitly when the runner has no GPU.
      - name: Compile shaders and host contracts
        run: cmake --build build --config Release --parallel 2
      - name: Validate reflection and host contracts
        run: >-
          ctest --test-dir build -C Release --output-on-failure --no-tests=error
          -E "^parallel-mater-d3d12-command-api-tests$"
      - name: Validate installed package components
        shell: bash
        run: |
          args=()
          if [[ "${{ matrix.d3d12 }}" == "ON" ]]; then
            args+=(--expect-driver-target ParallelMater::slang_d3d12_driver)
          fi
          if [[ "${{ matrix.cpu }}" == "ON" ]]; then
            args+=(--expect-driver-target ParallelMater::slang_cpu_driver)
          fi
          if [[ "${{ matrix.metal }}" == "ON" ]]; then
            args+=(--expect-driver-target ParallelMater::slang_metal_driver)
          fi
          python tools/check_sdk_components.py --build-dir build \
            --output out/sdk-components/ci "${args[@]}"
      - name: Retain reflection and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shader-portability-${{ matrix.os }}
          path: |
            build/generated/slang/**/*.json
            build/Testing/Temporary/*.log
            out/sdk-components/ci/report.json
            out/sdk-components/ci/*.log
          if-no-files-found: warn

  shader-portability:
    name: Shader portability required
    needs: compile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every compiler job to pass
        env:
          COMPILATION_RESULT: ${{ needs.compile.result }}
        run: test "$COMPILATION_RESULT" = success
